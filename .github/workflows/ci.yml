name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Build first: the browser-parity and service-worker suites drive the
      # production bundle in real Chrome, so dist/ must exist before `npm test`.
      - run: npm run build
      - name: Check build stamp landed in dist
        run: |
          test -f dist/version.json
          cat dist/version.json
          grep -q "<meta name=\"build\"" dist/index.html
      - run: npm test

  # Verifies the deployed site. Needs the repository variable LIVE_URL
  # (Settings → Secrets and variables → Actions → Variables → New variable).
  # When it is missing the job still runs so it can say so out loud: a silent
  # skip looks exactly like a passing deploy check.
  verify-deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Announce a missing LIVE_URL
        if: ${{ vars.LIVE_URL == '' }}
        run: |
          echo "::warning title=LIVE_URL is not set::The live-hash gate and the Playwright smoke test did NOT run. Add a repository variable LIVE_URL = https://row-data-converter.vercel.app (Settings → Secrets and variables → Actions → Variables) to enable them."
      - uses: actions/checkout@v4
        if: ${{ vars.LIVE_URL != '' }}
      - uses: actions/setup-node@v4
        if: ${{ vars.LIVE_URL != '' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ vars.LIVE_URL != '' }}
      - name: Fail when the live version.json hash differs from the pushed commit
        if: ${{ vars.LIVE_URL != '' }}
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          expected=$(git rev-parse --short HEAD)
          live=""
          body=""
          for i in $(seq 1 30); do
            body=$(curl -fsS "$LIVE_URL/version.json" || true)
            live=$(printf '%s' "$body" | sed -n 's/.*"hash"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            echo "attempt $i: live='$live' expected='$expected' body='$body'"
            if [ "$live" = "$expected" ]; then
              echo "MATCH: live version.json equals pushed commit $expected"
              exit 0
            fi
            sleep 20
          done
          echo "MISMATCH: live='$live' expected='$expected'"
          echo "Check the Vercel dashboard: Build logs, Production branch setting, Domains."
          exit 1

      # Drives the deployed site in real Chrome: uploads samples, waits for the
      # result, downloads the CSV, and fails on any console error, failed
      # request or non-2xx response.
      # Uploads real samples to the deployed site and asserts row counts and
      # specific cells against e2e/expected.json, so a regression in the live
      # build fails here instead of being noticed by a visitor.
      - name: Playwright content test on the live site
        if: ${{ vars.LIVE_URL != '' }}
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: node e2e/run.mjs --base-url "$LIVE_URL" --files samples/dev --out e2e-out